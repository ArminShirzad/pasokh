name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # The *.db.test.ts suites need a real Postgres (races and row ordering only
    # exist there); without one they skip, so CI provides it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pasokh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - run: npm run typecheck
      - run: npm run lint

      - name: Test (including database suites)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pasokh

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pasokh
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  installer:
    name: Installer scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && sh -n scripts/docker-entrypoint.sh && sh -n scripts/cron.sh
      - name: Compose file is valid
        # The compose file reads .env, which only an installed copy has.
        run: touch .env && POSTGRES_PASSWORD=x docker compose config --quiet
